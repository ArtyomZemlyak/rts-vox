[package]
name = "sim-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
fx = { path = "../fx" }
# Числа тика — из данных, а не из исходника (ADR-140). Разбор здесь,
# чтение файла — у того, кто запускает: `sim-core` не знает про файлы.
modding = { path = "../modding" }
phys = { path = "../phys" }
# Земля: воксельный мир, связность, проходимость (ADR-125).
nav = { path = "../nav" }
voxel = { path = "../voxel" }
worldgen = { path = "../worldgen" }

[lib]
name = "sim_core"
path = "src/lib.rs"
