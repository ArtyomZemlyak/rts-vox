[package]
name = "render"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# Bevy живёт только здесь (`docs/02-architecture.md`) и пинится точно:
# не пин — это молчаливое обновление, которое сдвинет всё разом.
[dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["3d", "ui_bevy_render"] }
bytemuck = "=1.25.2"
# Мешинг тоже рендер-слой (`docs/02-architecture.md`), мир и генератор
# нужны, чтобы было что показать.
meshing = { path = "../meshing" }
voxel = { path = "../voxel" }
worldgen = { path = "../worldgen" }
# Рендер **читает** состояние симуляции и никогда не пишет в него
# (`docs/02-architecture.md`). Зависимость направлена сюда и только сюда:
# обратную сторожит `harness`.
sim-core = { path = "../sim-core" }
# Числа тика читаются из данных: файл знает тот, кто запускает.
modding = { path = "../modding" }
fx = { path = "../fx" }

# Трассировка лучей — **выключенная фича**, а не часть обычной сборки.
#
# Причина в замере, а не в осторожности: на нашей сцене она сейчас
# не работает, потому что `bevy_solari` пересобирает структуру
# ускорения на каждый изменившийся меш, а у разрушаемого мира они
# меняются постоянно (ADR-222). Держать её включённой значит платить
# сборкой и размером двоичного файла за то, чем нельзя пользоваться.
#
# Включается явно: `cargo run -p render --bin battle --features rt -- --rt 1`.
[features]
rt = ["bevy/bevy_solari"]

[lib]
path = "src/lib.rs"
