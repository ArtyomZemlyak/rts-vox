[workspace]
resolver = "2"
members = ["crates/fx", "crates/harness", "crates/mesh", "crates/nav", "crates/sim", "crates/store", "crates/systems", "crates/topo"]

[workspace.package]
edition = "2021"
rust-version = "1.84"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
overflow-checks = true
