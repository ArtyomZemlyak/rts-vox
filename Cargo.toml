[workspace]
resolver = "2"
members = ["crates/demo", "crates/fx", "crates/gpu", "crates/harness", "crates/meshing", "crates/modding", "crates/nav", "crates/phys", "crates/render", "crates/sim-cli", "crates/sim-core", "crates/voxel", "crates/worldgen"]

[workspace.package]
edition = "2021"
rust-version = "1.95"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
overflow-checks = true

# Real SIM tests at optimized speed, without the release profile's costly
# whole-program link. Keep arithmetic checks identical to test/release.
[profile.sim-test]
inherits = "test"
opt-level = 1
lto = "off"
codegen-units = 256
incremental = true
debug = 1
overflow-checks = true
