[workspace]
resolver = "2"
members = ["crates/fx", "crates/gpu", "crates/harness", "crates/meshing", "crates/nav", "crates/sim-core", "crates/voxel"]

[workspace.package]
edition = "2021"
rust-version = "1.84"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
overflow-checks = true
