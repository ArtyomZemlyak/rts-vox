[workspace]
resolver = "2"
members = ["crates/demo", "crates/fx", "crates/gpu", "crates/harness", "crates/meshing", "crates/modding", "crates/nav", "crates/phys", "crates/render", "crates/sim-cli", "crates/sim-core", "crates/voxel", "crates/worldgen"]

[workspace.package]
edition = "2021"
rust-version = "1.95"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
overflow-checks = true
